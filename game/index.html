<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Square Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>

#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 80% at 50% 110%,rgba(255,150,60,.3),transparent 60%),rgba(10,14,24,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov h1{margin:0;font-size:clamp(46px,14vw,88px);line-height:.95;letter-spacing:.01em}
.ov h2{margin:0;font-size:clamp(38px,11vw,64px)}
.ov p{margin:0;font-size:17px;max-width:30ch;line-height:1.4}
.ov small{font-size:13px;opacity:.7;max-width:34ch;line-height:1.45}
button.go,button.gh{font:700 20px 'Chakra Petch',sans-serif;border-radius:16px;padding:0 34px;min-height:56px;cursor:pointer}
.go{background:var(--amber);color:#1b1305;border:0}
.gh{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:flex;align-items:center;gap:10px;background:var(--glass);padding:9px 16px;border-radius:12px;min-width:210px;font-weight:700}
li i{width:12px;height:12px;border-radius:50%}
li em{font-style:normal;opacity:.6;width:30px;text-align:left}
.hide{display:none}.demo #hud,.demo #ctl{display:none}
@media(prefers-reduced-motion:reduce){#cd{animation:none!important}}
input{font:700 18px 'Chakra Petch',sans-serif;min-height:52px;padding:0 16px;border-radius:14px;background:var(--glass);border:2px solid rgba(255,255,255,.25);color:var(--ink);text-align:center;width:min(280px,80vw);user-select:text;-webkit-user-select:text;touch-action:auto}
#cin{width:130px;text-transform:uppercase;letter-spacing:.15em}
#rc{letter-spacing:.12em}
.st{margin-left:auto;opacity:.7;font-weight:500}
#msg{min-height:1.4em}
#pl li,#rk li{min-width:min(300px,84vw)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="cd"></div>
<div id="ctl"><div id="stick"><div id="knob"></div></div>
<button class="btn" id="bp" data-k="punch">Punch</button><button class="btn" id="bk" data-k="kick">Kick</button>
<button class="btn" id="bb" data-k="block">Block</button><button class="btn" id="bd" data-k="dodge">Dodge</button></div>
<div id="menu" class="ov"><h1>Square Clash</h1><p>Create a room and share the code. 2 to 4 fighters, last one standing wins.</p>
<input id="nm" maxlength="12" placeholder="Your name" autocomplete="off">
<button class="go" id="mkb">Create room</button>
<div class="row"><input id="cin" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="gh" id="jn">Join</button></div>
<small id="msg"></small></div>
<div id="lobby" class="ov hide"><p>Room code</p><h1 id="rc"></h1><button class="gh" id="cp">Invite friends</button><ol id="pl"></ol>
<button class="go" id="rd">Ready</button><small id="rm"></small></div>
<div id="end" class="ov hide"><h2 id="wt"></h2><ol id="rk"></ol><p id="mt"></p>
<div class="row"><button class="go" id="again">Back to room</button><button class="gh" id="home">Leave</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Q=s=>document.querySelector(s),CS=['#4aa3ff','#ff5a5a','#46e0a0','#ffd447'],A=7.4,TAU=Math.PI*2;

const sun=new THREE.DirectionalLight(0xffe2b8,.85);sun.position.set(6,14,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);

function tex(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#262d3d';x.fillRect(0,0,512,512);

const fl=new THREE.Mesh(new THREE.PlaneGeometry(A*2+1,A*2+1),new THREE.MeshStandardMaterial({map:tex(),roughness:.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0x0b0f19}));gr.rotation.x=-Math.PI/2;gr.position.y=-.02;S.add(gr);
const M=(c,r=.8,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,emissive:e});

const wm=M(0x2c3445);[[0,1],[0,-1]].forEach(([_,s])=>box(A*2+1.6,.9,.5,wm,0,.45,s*(A+.75)));[1,-1].forEach(s=>box(.5,.9,A*2+1.6,wm,s*(A+.75),.45,0));

const fp=new THREE.Mesh(new THREE.CylinderGeometry(.8,.9,1.9,8),M(0x2f3a52));fp.position.y=1.4;fp.castShadow=true;S.add(fp);
const po=new THREE.Mesh(new THREE.SphereGeometry(.28,14,12),M(0x7dffd0,.3,0x2fbf8f));po.position.y=2.6;S.add(po);
const pl=new THREE.PointLight(0x5dffc0,.9,9);pl.position.y=2.6;S.add(pl);
const TO=[];[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([a,b])=>{const x=a*(A+.75),z=b*(A+.75);box(.9,2.1,.9,M(0x2c3445),x,1.05,z);
const f=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),M(0xffb347,.5,0xff8a1f));f.position.set(x,2.35,z);S.add(f);
const l=new THREE.PointLight(0xff9a3c,1.2,15);l.position.set(x,2.8,z);S.add(l);TO.push(l)});
function mk(i,bot){const g=new THREE.Group(),b=new THREE.Group(),sk=M(0xe0b08a,.7),cl=M(CS[i],.6),dk=M(0x2a2f3c);g.add(b);
const ad=(geo,m,x,y,z,p=b)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
ad(new THREE.CylinderGeometry(.34,.4,.8,10),cl,0,1.15,0);ad(new THREE.SphereGeometry(.28,14,12),sk,0,1.82,0);ad(new THREE.CylinderGeometry(.29,.29,.09,12),dk,0,1.9,0);
const lm=(m,x,y,L,r,fist)=>{const p=new THREE.Group();p.position.set(x,y,0);b.add(p);ad(new THREE.CylinderGeometry(r,r*.9,L,8),m,0,-L/2,0,p);if(fist)ad(new THREE.SphereGeometry(.13,8,8),sk,0,-L,0,p);return p};
const ring=new THREE.Mesh(new THREE.RingGeometry(.8,.97,40),new THREE.MeshBasicMaterial({color:CS[i],side:THREE.DoubleSide,transparent:true,opacity:.9}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);
const f={i,g,body:b,cloth:cl,ring,bot,hp:100,alive:true,x:0,z:0,h:0,act:null,t:0,dur:1,cd:0,dodgeCd:0,hurt:0,flash:0,kx:0,kz:0,arm:0,wt:0,th:0,mode:.5,block:false,hit:false,dx:0,dz:0,
aL:lm(sk,-.5,1.45,.7,.1,1),aR:lm(sk,.5,1.45,.7,.1,1),lL:lm(dk,-.2,.75,.75,.13),lR:lm(dk,.2,.75,.75,.13)};
if(!bot){f.mark=new THREE.Mesh(new THREE.ConeGeometry(.17,.34,3),M(0xffffff,.4,0xaaaaaa));f.mark.rotation.x=Math.PI;g.add(f.mark)}S.add(g);return f}

f.lL.rotation.x=w;f.lR.rotation.x=-w;f.aL.rotation.x=-.9-w*.3;f.aR.rotation.x=-.9+w*.3;f.aL.rotation.z=.25;f.aR.rotation.z=-.25;
g.rotation.set(0,f.h,0);g.position.set(f.x,Math.abs(w)*.08,f.z);
if(f.act==='punch'){const p=Math.sin(f.t/f.dur*Math.PI),a=f.arm?f.aR:f.aL;a.rotation.x=-.9-p*.75;a.rotation.z=0;b.rotation.y=(f.arm?-1:1)*.35*p}
else if(f.act==='kick'){const p=Math.sin(f.t/f.dur*Math.PI);f.lR.rotation.x=-1.55*p;b.rotation.x=.3*p}
else if(f.act==='dodge'){b.rotation.x=.9;g.position.y=-.05}

function camU(dt){const L=F.filter(f=>f.alive),T=L.length?L:F;let cx=0,cz=0;T.forEach(f=>{cx+=f.x;cz+=f.z});cx/=T.length;cz/=T.length;let sx=0,sz=0;
T.forEach(f=>{sx=Math.max(sx,Math.abs(f.x-cx));sz=Math.max(sz,Math.abs(f.z-cz))});
const tv=Math.tan(cam.fov*Math.PI/360),th=tv*cam.aspect;let d=Math.max((sx*2+7)/(2*th),(sz*2+7)/(2*tv*.8));d=Math.min(Math.max(d,13),36);

function human(){const k=keys;let mx=stick.x+(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),mz=stick.z+(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);const m=Math.hypot(mx,mz);if(m>1){mx/=m;mz/=m}
return{mx,mz,punch:btn.punch||k.j,kick:btn.kick||k.k,block:btn.block||k.l,dodge:btn.dodge||k[' ']}}
const sk=Q('#stick'),kb=Q('#knob');let sid=null;
function sm(e){const r=sk.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const d=Math.hypot(dx,dy),Mx=46;if(d>Mx){dx*=Mx/d;dy*=Mx/d}kb.style.transform=`translate(${dx}px,${dy}px)`;stick.x=dx/Mx;stick.z=dy/Mx}
sk.addEventListener('pointerdown',e=>{sid=e.pointerId;sk.setPointerCapture(e.pointerId);sm(e)});
sk.addEventListener('pointermove',e=>{if(e.pointerId===sid)sm(e)});
const sr=e=>{if(e.pointerId===sid){sid=null;stick.x=stick.z=0;kb.style.transform=''}};sk.addEventListener('pointerup',sr);sk.addEventListener('pointercancel',sr);
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k,off=()=>{btn[k]=0;b.classList.remove('on')};
b.addEventListener('pointerdown',e=>{e.preventDefault();btn[k]=1;b.classList.add('on')});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off))});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('contextmenu',e=>e.preventDefault());
const WS_URL='wss://square-clash.onrender.com';
const ang=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let ws,opened=false,me=-1,st='menu',cdt='',last=performance.now();
const show=id=>['menu','lobby','end'].forEach(k=>Q('#'+k).classList.toggle('hide',k!==id));
const msg=t=>Q('#msg').textContent=t||'';
const s=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function cdn(t){const e=Q('#cd');if(cdt===t)return;cdt=t;e.textContent=t;e.style.animation='none';e.offsetWidth;e.style.animation=t?'pop .4s ease-out':''}

function conn(cb){if(ws&&ws.readyState===1)return cb();msg('Connecting. The free server can take up to a minute to wake up.');opened=false;
ws=new WebSocket(WS_URL);ws.onopen=()=>{opened=true;msg('');cb()};ws.onmessage=e=>on(JSON.parse(e.data));
ws.onclose=()=>{const was=opened;opened=false;clear();show('menu');msg(was?'Connection lost. Create or join a room again.':'Could not reach the server. Try again in a moment.')}}
function on(m){switch(m.t){
case'err':show('menu');msg(m.m);break;
case'room':{me=m.you;names={};m.players.forEach(p=>names[p.slot]=p.name);if(F.length)clear();st='lobby';document.body.className='demo';show('lobby');Q('#rc').textContent=m.code;
Q('#pl').innerHTML=m.players.map(p=>`<li><i style="background:${CS[p.slot]}"></i>${esc(p.name)}${p.slot===me?' (you)':''}<span class="st">${p.ready?'Ready':'Waiting'}</span></li>`).join('');
const my=m.players.find(p=>p.slot===me);Q('#rd').textContent=my&&my.ready?'Not ready':'Ready';
Q('#rm').textContent=m.players.length<2?'Share the code. You need at least 2 players.':'The match starts when everyone is ready.';break}
case'go':{show('');document.body.className='';F.forEach(f=>S.remove(f.g));F=[];FM={};
m.slots.forEach(sl=>{const f=mk(sl,sl!==me);f.slot=sl;f.first=1;f.lhp=-1;f.tx=f.tz=f.th=0;F.push(f);FM[sl]=f});
Q('#hud').innerHTML=F.map(f=>`<div class="pl" id="p${f.slot}" style="--c:${CS[f.slot]}"><b><span>${esc(names[f.slot]||'')}</span><span id="n${f.slot}">100</span></b><div class="bar"><i id="b${f.slot}"></i></div></div>`).join('');
st='count';cam.position.set(0,16,11);break}
case's':snap(m);break;
case'end':{st='over';const T=['1st','2nd','3rd','4th'],e=Q('#wt');e.textContent=m.w===me?'You win':(names[m.w]||'Player')+' wins';e.style.color=CS[m.w];

function snap(m){if(st==='over')return;if(m.st==='count')cdn(String(m.ct));else if(st==='count'){cdn('Fight!');setTimeout(()=>cdn(''),700)}

for(const a of m.f){const f=FM[a[0]];if(!f)continue;
f.tx=a[1];f.tz=a[2];f.th=a[3];f.alive=!!a[5];f.act=[null,'punch','kick','dodge'][a[6]];f.dur=[1,.34,.55,.26][a[6]];f.t=a[7];f.arm=a[8];f.block=!!a[9];f.hurt=a[10];f.flash=a[11];

if(a[4]!==f.lhp){f.lhp=a[4];Q('#b'+f.slot).style.width=a[4]+'%';Q('#n'+f.slot).textContent=a[4]}
if(!f.alive)Q('#p'+f.slot).classList.add('out')}
m.ev.forEach(e=>{shake=Math.min(.6,shake+(e[1]?.1:.25));if(e[0]===me&&!e[1]&&navigator.vibrate)navigator.vibrate(35)})}
setInterval(()=>{if(st==='fight'){const h=human();s({t:'in',mx:+h.mx.toFixed(2),mz:+h.mz.toFixed(2),punch:+!!h.punch,kick:+!!h.kick,block:+!!h.block,dodge:+!!h.dodge})}},33);
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
TO.forEach((l,i)=>l.intensity=1.1+Math.sin(now/90+i*2)*.25+Math.random()*.1);po.position.y=2.6+Math.sin(now/600)*.1;

Q('#nm').value=(()=>{try{return localStorage.getItem('sc-name')||''}catch(e){return''}})();
const nm=()=>{const v=Q('#nm').value.trim();try{localStorage.setItem('sc-name',v)}catch(e){}return v};
Q('#mkb').onclick=()=>conn(()=>s({t:'create',name:nm()}));

Q('#rd').onclick=()=>s({t:'ready'});
Q('#cp').onclick=async()=>{const code=Q('#rc').textContent,u=location.origin+location.pathname+'?room='+code,b=Q('#cp');
if(navigator.share){try{await navigator.share({title:'Square Clash',text:'Join my Square Clash room '+code,url:u})}catch(e){}return}
try{await navigator.clipboard.writeText(u);b.textContent='Link copied'}catch(e){b.textContent=u}setTimeout(()=>b.textContent='Invite friends',2500)};
